name: Exact LLM
on:
  workflow_dispatch:
  push:
    paths:
      - 'proofs/exact-llm/**'
      - '!proofs/exact-llm/**/*.md'
      - '.github/workflows/exact-llm.yml'
permissions:
  contents: read
jobs:
  hashes:
    name: hashes (${{ matrix.model }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.model == 'SmolLM2-135M' && 90 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        model: [SmolLM2-135M, SmolLM2-360M]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: NumPy, and onnxruntime where this runner has a wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install onnxruntime || echo "onnxruntime: no wheel for this runner"
      - name: The machine
        shell: bash
        run: python -c "import platform, numpy; print(platform.platform(), platform.machine(), 'numpy', numpy.__version__); numpy.show_config()"
      - name: The 16-bit products on their three routes against int64, random and extreme operands
        shell: bash
        working-directory: proofs/exact-llm
        run: python routes_test.py
      - name: The hashes over the 64 prompts (135M: exact and exact-16; larger: exact-16), float32, onnxruntime; fails if a pair differs
        shell: bash
        working-directory: proofs/exact-llm
        run: python -u exact_llm.py check --model ${{ matrix.model }}
