name: Exact LLM
on:
  workflow_dispatch:
  push:
    paths:
      - 'proofs/exact-llm/**'
      - '.github/workflows/exact-llm.yml'
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: NumPy, and onnxruntime where this runner has a wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install onnxruntime || echo "onnxruntime: no wheel for this runner"
      - name: The machine
        shell: bash
        run: python -c "import platform, numpy; print(platform.platform(), platform.machine(), 'numpy', numpy.__version__); numpy.show_config()"
      - name: Exact, float32 and onnxruntime hashes over the 64 prompts; fails if the exact hashes differ
        shell: bash
        working-directory: proofs/exact-llm
        run: python exact_llm.py check
